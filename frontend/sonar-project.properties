# SonarQube server
# sonar.host.url & sonar.login are set by the Scanner CLI.
# See https://docs.sonarqube.org/latest/analysis/gitlab-cicd/.

# Project settings.
sonar.projectKey=spf:frontend-splatforma
sonar.projectName=Splatforma FrontEnd
sonar.projectDescription=Code Quality CI stage.
sonar.links.ci=https://gitlab.kendart-systems.com/testprj_fedir/FrontEndProd/pipelines
sonar.links.issue=https://projects.kendart-systems.com/projects/STRP

# Scan settings.
sonar.projectBaseDir=.
# Define the directories that should be scanned. Comma separated.
# sonar.sources=./src,./resources,./web
sonar.sources=.
# sonar.test.inclusions=**/*Test.php
# sonar.php.coverage.reportPaths=./coverage/lcov.info
# sonar.php.file.suffixes=php
# sonar.sourceEncoding=UTF-8

sonar.exclusions=,**/.scannerwork/**,./node_modules,./heroku,./production
# increase sonar scaner mem for eslint actions
sonar.javascript.node.maxspace=16384

# Fail CI pipeline if Sonar fails.
# sonar.qualitygate.wait=true
