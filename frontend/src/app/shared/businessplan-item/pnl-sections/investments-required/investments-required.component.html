<app-wbr-pivot #investmentsRequired [toolbar]="false" (ready)="onPivotReady()"></app-wbr-pivot>

<form [formGroup]="form" nz-form nzLayout="horizontal">
    <div>
        <div nz-row [nzGutter]="16">
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label nzLabelAlign="left" nzSpan="19">Safety pillow</nz-form-label>
              <nz-form-control nzSpan="5">
                <nz-input-number-group nzAddOnAfter="%">
                  <nz-input-number [nzMin]="0" [nzMax]="100" [nzStep]="1" 
                    placeholder="safety pillow" formControlName="safetyPillow"></nz-input-number>
                </nz-input-number-group>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
    </div>
  
    <div nz-row nzJustify="end">
      <button nz-button nzType="primary" type="submit" (click)="applyChanges()">
        Apply
      </button>
    </div>
</form>
