<form [formGroup]="form" nz-form nzLayout="horizontal">
  <div>
    <div nz-row [nzGutter]="16">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" nzSpan="19"> {{'bp.acceleration.startFromMonth' | translate}} </nz-form-label>
          <nz-form-control nzErrorTip="Please, fill in dat" nzSpan="5">
            <input nz-input type="number" placeholder="1" min="1" formControlName="startMonthSales" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" nzSpan="5">As</nz-form-label>
          <nz-form-control nzErrorTip="Please, fill in data" nzSpan="5">
            <nz-input-group nzSuffixIcon="percentage">
              <input type="number" nz-input placeholder="30" min="1"  formControlName="expectedMonthGrowthSales" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row [nzGutter]="16">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" nzSpan="19">{{'bp.acceleration.estimated' | translate}}</nz-form-label>
          <nz-form-control nzErrorTip="Please, fill in dat" nzSpan="5">
            <input nz-input type="number" placeholder="12" min="1" formControlName="expectedMonthsFullSales" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" nzSpan="5" [nzTooltipTitle]="'bp.acceleration.notEditableRef' | translate"
            [nzTooltipIcon]="tooltipIcon">As</nz-form-label>
          <nz-form-control nzSpan="5">
            <span nz-typography nzType="secondary"><b>100 %</b></span>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row [nzGutter]="16" formGroupName="expectedMonthSales">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" nzSpan="19">{{'bp.acceleration.estimatedScale' | translate}}</nz-form-label>
          <nz-form-control nzErrorTip="Please, fill in dat" nzSpan="5">
            <input nz-input type="number" placeholder="36" min="1" formControlName="month"/>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" nzSpan="5" [nzTooltipTitle]="'bp.acceleration.notUsedRef' | translate"
            [nzTooltipIcon]="tooltipIcon">As</nz-form-label>
          <nz-form-control nzSpan="5">
            <nz-input-group nzSuffixIcon="percentage">
              <input type="number" nz-input placeholder="110" min="1" formControlName="growth"/>
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </div>

  <div nz-row nzJustify="end">
    <button style="width: 100px;" nz-button nzType="primary" type="submit" (click)="applyChanges()">
        <span *ngIf="(componentName$ | async) !== componentName">Apply</span>
        <nz-spin *ngIf="(componentName$ | async) === componentName" nzSimple [nzSize]="'small'"></nz-spin>
    </button>
  </div>
</form>
