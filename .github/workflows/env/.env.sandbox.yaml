# Test sfrontend Environment Variables
name: sfrontend sandbox Config
pipeline:
    enabled: true
branch:
    type: sandbox

# Global Flags for Quick Action
global:
    build: true                 # you  can optionally add '[no build]' to commit message to skip apim deploymen
    deploy: true                # you  can optionally add '[no deploy]' to commit message to skip apim deployment
    scan-containers: false      # you  can optionally add '[no grype]' to commit message to scan containers
    linting: true              # you  can optionally add '[no lint]' to commit message to skip linting

# Build and Push Configuration
buildpushmatrix:
  - name: 'Sfrontend to Gitlab Container Registry'
    enabled: true
    build:
        name: npmjs
        buildArgs: ''
        dockerfile: './frontend/Dockerfile' 
        imagename: /splatforma/sfrontend
        imagetag: sandbox-github

# Create Application Configuration
createappmatrix:
  # - name: 'ArgoCD [Old Bucharest Cluster]'
  #   enabled: true
  #   cluster:
  #       name: dev_cluster
  #       argocdurl: 'k3s-argocd.wlasnasprawa.com'   
  #       namespace: 'default'
  #       argocdusername: 'ARGO_USERNAME_BUCHAREST'
  #       argocdpassword: 'ARGO_PASSWORD_BUCHAREST'
  #       appname: 'splatform-sandbox'
  #       sourcemanifest: 'splatform-sandbox.bucharest.yaml'

  - name: 'ArgoCD [Bucharest chmlro Cluster Sandbox]'
    enabled: true
    cluster:
        name: prd_cluster
        argocdurl: 'argocd-chmlro-wlsnprw-prd.wlasnasprawa.com'   
        namespace: 'default'
        argocdusername: 'ARGO_USERNAME_CHMLRO'
        argocdpassword: 'ARGO_PASSWORD_CHMLRO'
        appname: 'splatform-sandbox'
        sourcemanifest: 'splatform-sandbox.bucharest.yaml'

  - name: 'ArgoCD [Poznan Cluster - Sandbox]'
    enabled: true
    cluster:
        name: dev_cluster
        argocdurl: 'app-argocd-dev-poznan.wlasnasprawa.com'   
        namespace: 'default'
        argocdusername: 'ARGO_USERNAME_POZNAN'
        argocdpassword: 'ARGO_PASSWORD_POZNAN'
        appname: 'splatform-sandbox'
        sourcemanifest: 'splatform-sandbox.poznan.yaml'

# Deploy Configuration
deploymatrix:
  # - name: 'ArgoCD [Old Bucharest Cluster]'
  #   enabled: true
  #   cluster:
  #       name: dev_cluster
  #       argocdurl: 'k3s-argocd.wlasnasprawa.com'   
  #       namespace: 'default'
  #       argocdusername: 'ARGO_USERNAME_BUCHAREST'
  #       argocdpassword: 'ARGO_PASSWORD_BUCHAREST'
  #       appname: 'splatform-sandbox'
  #       parametername: 'splatformafrontend-app.pipelinedeployed'
  #       parametervalue: 'sandbox'
  #       appendtimestamp: true

  - name: 'ArgoCD [Bucharest chmlro Cluster Sandbox]'
    enabled: true
    cluster:
        name: prd_cluster
        argocdurl: 'argocd-chmlro-wlsnprw-prd.wlasnasprawa.com'   
        namespace: 'default'
        argocdusername: 'ARGO_USERNAME_CHMLRO'
        argocdpassword: 'ARGO_PASSWORD_CHMLRO'
        appname: 'splatform-sandbox'
        parametername: 'splatformafrontend-app.pipelinedeployed'
        parametervalue: 'sandbox'
        appendtimestamp: true

  - name: 'ArgoCD [Poznan Cluster - Sandbox]'
    enabled: true
    cluster:
        name: dev_cluster
        argocdurl: 'app-argocd-dev-poznan.wlasnasprawa.com'   
        namespace: 'default'
        argocdusername: 'ARGO_USERNAME_POZNAN'
        argocdpassword: 'ARGO_PASSWORD_POZNAN'    
        appname: 'splatform-sandbox'
        parametername: 'splatformafrontend-app.pipelinedeployed'
        parametervalue: 'sandbox'
        appendtimestamp: true

syncmatrix:
  # - name: 'ArgoCD [Old Bucharest Cluster] - Sync sfrontend App'
  #   enabled: true
  #   cluster:
  #       name: dev_cluster
  #       argocdurl: 'k3s-argocd.wlasnasprawa.com'   
  #       namespace: 'default'
  #       argocdusername: 'ARGO_USERNAME_BUCHAREST'
  #       argocdpassword: 'ARGO_PASSWORD_BUCHAREST'
  #       appname: 'splatform-sandbox'
  #       delaybeforesync: 90s

  - name: 'ArgoCD [Bucharest chmlro Cluster] - Sync sfrontend App'
    enabled: true
    cluster:
        name: dev_cluster
        argocdurl: 'argocd-chmlro-wlsnprw-prd.wlasnasprawa.com'   
        namespace: 'default'
        argocdusername: 'ARGO_USERNAME_CHMLRO'
        argocdpassword: 'ARGO_PASSWORD_CHMLRO'
        appname: 'splatform-sandbox'
        delaybeforesync: 90s

  - name: 'ArgoCD [Poznan Cluster - TST] - Sync sfrontend App'
    enabled: true
    cluster:
        name: dev_cluster
        argocdurl: 'app-argocd-dev-poznan.wlasnasprawa.com'   
        namespace: 'default'
        argocdusername: 'ARGO_USERNAME_POZNAN'
        argocdpassword: 'ARGO_PASSWORD_POZNAN'
        appname: 'splatform-sandbox'
        delaybeforesync: 90s

# Linting Configuration
lintmatrix:
    - name: Codebase Linting
      FILTER_REGEX_INCLUDE: ".*.*"
      FILTER_REGEX_EXCLUDE: ""
      DISABLE_ERRORS: true

# Logging Configuration
logging:
    level: debug
