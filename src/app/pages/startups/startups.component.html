<a routerLink="../add-startup" class="btn btn-primary btn-add-idea green">
  <mat-icon aria-hidden="false" aria-label="add circle icon" fontIcon="add_circle"></mat-icon>
  <span>Add startup</span>
</a>

<div class="container-fluid">
  <div class="row" *ngFor="let item of list">
    <div class="col-xs-12">
      <form class="card">
        <div class="form-group">
          <label for="title" class="control-label">
            id:{{item.id}}, type:{{item.recordtype}}, Created: {{item.created}} by {{ item.userprofile == undefined ?
            false: item.userprofile.username }}, Public avaliability :{{item.ispublic}}
          </label>
          <input id="title" type="text" class="form-control" value="{{item.ideatitle}}">
        </div>
        <div class="form-group">
          <label for="description" class="control-label">Description:</label>
          <textarea id="description" cols="30" rows="10" class="form-control">{{item.ideadescription}}</textarea>
        </div>
        <div class="form-group">
          <a [routerLink]="['/idea-comments']" [queryParams]="{'ideaid': item.id}" class="btn btn-primary">See
            comments</a>
          <a [routerLink]="['/edit-idea']" [queryParams]="{'ideaid': item.id}" class="btn btn-primary">Edit</a>
          <a [routerLink]="['/add-startup']" [queryParams]="{'ideaid': item.id}" class="btn btn-primary">Create
            startup</a>
        </div>
      </form>
    </div>
  </div>
</div>
