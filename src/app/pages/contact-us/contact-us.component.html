<nz-card [nzBordered]="false">
  <form [formGroup]="form" nz-form nzLayout="vertical">

    <h2>{{'helpAndContactUs.title'|translate}}</h2>
    <div class="text-input-container">

      <nz-form-item>
        <nz-form-label [nzXs]="24" nzFor="category">{{'helpAndContactUs.category'|translate}}</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <select nz-input formControlName="category" class="form-control">
            <option value="question" selected>{{'helpAndContactUs.question'|translate}}</option>
            <option value="issue">{{'helpAndContactUs.issue'|translate}}</option>
            <option value="feedback">{{'helpAndContactUs.feedback'|translate}}</option>
            <option value="other">{{'helpAndContactUs.other'|translate}}</option>
          </select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzXs]="24" nzFor="email" nzRequired>{{'helpAndContactUs.email'|translate}}</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24" [nzErrorTip]="'helpAndContactUs.emailNotValid'|translate">
          <input nz-input formControlName="email"/>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzXs]="24" nzFor="message" nzRequired>{{'helpAndContactUs.message'|translate}}</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24" [nzErrorTip]="'helpAndContactUs.messageRequired'|translate">
          <textarea nz-input formControlName="message"></textarea>
        </nz-form-control>
      </nz-form-item>
    </div>

    <nz-form-item>
      <nz-form-control
        [nzSm]="14"
        [nzXs]="24"
      >
        <div nz-row [nzGutter]="8">
          <div nz-col [nzSpan]="12">
            <button
              nz-button
              nzType="primary"
              nzBlock
              [disabled]="!form.valid"
              (click)="submit()">
              {{ 'helpAndContactUs.submit'|translate}}
            </button>
          </div>
        </div>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-card>
