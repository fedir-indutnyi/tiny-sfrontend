####################### Build Job #######################

synchronize-job:
  stage: ☕ synchronize
  tags:
    - "splatforma-production-velia"
  rules:
    - if: $RUN_SYNC_JOB == "true" && $CI_COMMIT_BRANCH == "sandbox"
      variables: !reference [.synchronize-staging, variables]
  extends:
    - .sync-central-repo-template